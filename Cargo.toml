[package]
name = "vless-RS"
version = "0.1.0"
edition = "2021"
authors = ["Antigravity Engineering"]
description = "High-performance standalone VLESS + RAW + REALITY server in Rust for DPI & TSPU circumvention"

[dependencies]
tokio = { version = "1.53.1", features = ["full"] }
x25519-dalek = { version = "3.0.0", features = ["static_secrets"] }
uuid = { version = "1.26.0", features = ["v4", "fast-rng"] }
clap = { version = "4.6.6", features = ["derive", "env"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
anyhow = "1.0.104"
fastrand = "2.5.0"
hex = "0.4.3"
base64 = "0.23.1"
qrcode = { version = "0.14.1", default-features = false }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
