[package]
name = "vless-vpn"
version = "0.1.0"
edition = "2021"
authors = ["Antigravity Engineering"]
description = "High-performance standalone VLESS + RAW + REALITY server in Rust for DPI & TSPU circumvention"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
x25519-dalek = { version = "3.0.0", features = ["static_secrets"] }
sha2 = "0.11.0"
hkdf = "0.13.0"
chacha20poly1305 = "0.11.0"
uuid = { version = "1.8", features = ["v4", "fast-rng"] }
clap = { version = "4.5", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
fastrand = "2.1"
subtle = "2.5"
hex = "0.4"
base64 = "0.23.1"
qrcode = { version = "0.14.1", default-features = false }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
